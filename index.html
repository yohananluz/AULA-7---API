<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Store Produtos</title>
  <style>
    :root {
      --bg: #eef2f7;
      --panel: #ffffff;
      --text: #172033;
      --muted: #667085;
      --line: #d8dee9;
      --primary: #f97316;
      --primary-dark: #ea580c;
      --danger: #e11d48;
      --radius: 8px;
      --shadow: 0 24px 60px rgba(23, 32, 51, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      background:
        radial-gradient(circle at top left, rgba(249, 115, 22, 0.18), transparent 30%),
        radial-gradient(circle at bottom right, rgba(251, 191, 36, 0.18), transparent 28%),
        var(--bg);
      color: var(--text);
      font-family: Inter, Arial, Helvetica, sans-serif;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button,
    label {
      cursor: pointer;
    }

    .app {
      width: min(100%, 980px);
      min-height: 620px;
      padding: 24px;
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.76);
      box-shadow: var(--shadow);
    }

    .app-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      min-height: 160px;
      padding: 28px;
      border-radius: 16px;
      background:
        linear-gradient(135deg, rgba(23, 32, 51, 0.96), rgba(249, 115, 22, 0.92)),
        #172033;
      color: #ffffff;
      overflow: hidden;
      position: relative;
    }

    .app-header::after {
      content: "";
      position: absolute;
      right: 28px;
      top: 22px;
      width: 150px;
      height: 150px;
      border: 28px solid rgba(255, 255, 255, 0.12);
      border-radius: 50%;
    }

    .app-header > * {
      position: relative;
      z-index: 1;
    }

    .app-header h1 {
      margin: 0;
      font-size: clamp(34px, 5vw, 58px);
      line-height: 0.95;
      letter-spacing: 0;
    }

    .actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 24px 0;
    }

    .actions strong {
      display: block;
      font-size: 22px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 22px;
      border: 0;
      border-radius: var(--radius);
      background: var(--primary);
      color: #ffffff;
      font-size: 15px;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 12px 24px rgba(249, 115, 22, 0.28);
      transition: transform 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
    }

    .btn:hover {
      background: var(--primary-dark);
      box-shadow: 0 16px 30px rgba(249, 115, 22, 0.34);
      transform: translateY(-1px);
    }

    .products {
      display: grid;
      grid-template-columns: minmax(0, 300px);
      gap: 18px;
      justify-content: center;
    }

    .product-card {
      min-width: 0;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--panel);
      box-shadow: 0 10px 24px rgba(23, 32, 51, 0.08);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .product-card:hover {
      box-shadow: 0 18px 34px rgba(23, 32, 51, 0.13);
      transform: translateY(-3px);
    }

    .product-image {
      width: 100%;
      aspect-ratio: 1.1 / 1;
      border-radius: 10px;
      position: relative;
      overflow: hidden;
    }

    .product-image::before {
      content: "*";
      position: absolute;
      left: 22%;
      top: 10%;
      color: rgba(255, 255, 255, 0.85);
      font-size: 96px;
      font-weight: 900;
      line-height: 1;
    }

    .product-image::after {
      content: "";
      position: absolute;
      width: 82px;
      height: 82px;
      right: 12%;
      bottom: 10%;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.72);
      transform: rotate(12deg);
    }

    .product-image-orange {
      background: linear-gradient(135deg, #f97316, #facc15);
    }

    .product-card h2 {
      margin: 10px 0 6px;
      font-size: 18px;
    }

    .product-description {
      min-height: 40px;
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    .product-price {
      margin: 14px 0;
      font-size: 20px;
      font-weight: 900;
    }

    .card-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .btn-small {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #f8fafc;
      color: var(--text);
      font-size: 13px;
      font-weight: 800;
      transition: background 0.18s ease, color 0.18s ease, border-color 0.18s ease;
    }

    .btn-small:hover {
      border-color: var(--primary);
      background: #fff7ed;
      color: var(--primary-dark);
    }

    .btn-danger {
      color: var(--danger);
    }

    .btn-danger:hover {
      border-color: var(--danger);
      background: #fff1f2;
      color: var(--danger);
    }

    .modal-toggle {
      display: none;
    }

    .modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 10;
    }

    #modal-criar:checked ~ .modal-create,
    #modal-editar:checked ~ .modal-edit {
      display: flex;
    }

    .modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.62);
      backdrop-filter: blur(6px);
    }

    .modal-content {
      position: relative;
      width: min(92vw, 460px);
      padding: 24px;
      border-radius: 16px;
      background: var(--panel);
      box-shadow: 0 28px 70px rgba(15, 23, 42, 0.35);
      z-index: 1;
    }

    .modal-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 22px;
    }

    .modal-header h2 {
      margin: 0;
      font-size: 26px;
    }

    .close-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: #f8fafc;
      color: var(--text);
      font-size: 18px;
      font-weight: 900;
    }

    .close-button:hover {
      background: #fee2e2;
      color: var(--danger);
    }

    .product-form {
      display: grid;
      gap: 14px;
    }

    .product-form label {
      display: grid;
      gap: 7px;
      color: var(--text);
      font-size: 14px;
      font-weight: 800;
    }

    .product-form input,
    .product-form textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 12px 13px;
      background: #f8fafc;
      color: var(--text);
      outline: none;
      transition: border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    }

    .product-form input:focus,
    .product-form textarea:focus {
      border-color: var(--primary);
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(249, 115, 22, 0.16);
    }

    @media (max-width: 760px) {
      .app-header {
        align-items: flex-start;
        flex-direction: column;
        min-height: 220px;
      }

      .products {
        grid-template-columns: minmax(0, 300px);
      }
    }

    @media (max-width: 520px) {
      body {
        align-items: flex-start;
        padding: 16px 10px;
      }

      .app {
        padding: 14px;
        border-radius: 18px;
      }

      .app-header {
        padding: 22px;
      }

      .actions {
        align-items: stretch;
        flex-direction: column;
      }

      .btn {
        width: 100%;
      }

      .products {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="app-header">
        <h1>Adicione ou remova produtos</h1>
    </header>

    <input type="checkbox" id="modal-criar" class="modal-toggle">
    <input type="checkbox" id="modal-editar" class="modal-toggle">

    <section class="actions">
      <div>
        <strong>Produtos</strong>
      </div>
      <label for="modal-criar" class="btn btn-primary">+ Add product</label>
    </section>

    <!-- produtos cadastrados -->
    <section class="products" id="lista" aria-label="Lista de produtos">

      

    </section>


    <!-- modal -->
    <div class="modal modal-create">
      <label for="modal-criar" class="modal-backdrop" aria-label="Fechar modal"></label>

      <section class="modal-content" aria-labelledby="titulo-criar">
        <div class="modal-header">
            <h2 id="titulo-criar">Adicionar produto</h2>
          <label for="modal-criar" class="close-button" aria-label="Fechar">x</label>
        </div>

        <div class="product-form" id="form-criar">
          <label>
            Nome
            <input type="text" id="nome" placeholder="Ex: Teclado mecanico">
          </label>

          <label>
            Preco
            <input type="number" id="preco" placeholder="Ex: 199.90">
          </label>

          <label>
            URL da imagem
            <input type="url" id="imagem" placeholder="https://...">
          </label>

          <label>
            Descricao
            <textarea id="descricao" rows="4" placeholder="Detalhes do produto"></textarea>
          </label>

          <button type="button" class="btn btn-primary" onclick=" criarProduto()">Salvar produto</button>
        </div>

      </section>

    </div>

    <!-- modal editar -->
    <div class="modal modal-edit">
      <label for="modal-editar" class="modal-backdrop" aria-label="Fechar modal"></label>

      <section class="modal-content" aria-labelledby="titulo-editar">
        <div class="modal-header">
          <h2 id="titulo-editar">Editar produto</h2>
          <label for="modal-editar" class="close-button" aria-label="Fechar">x</label>
        </div>

        <div class="product-form" id="form-editar">
          <input type="hidden" id="editar-id" value="1">

          <label>
            Nome
            <input type="text" id="editar-nome" value="Headset Pulse">
          </label>

          <label>
            Preco
            <input type="number" id="editar-preco" value="99.90">
          </label>

          <label>
            URL da imagem
            <input type="url" id="editar-imagem" value="https://placehold.co/300x260/f97316/ffffff?text=*">
          </label>

          <label>
            Descricao
            <textarea id="editar-descricao" rows="4">Audio limpo para calls e jogos.</textarea>
          </label>

          <button type="button" class="btn btn-primary">Atualizar produto</button>
        </div>
      </section>
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
